  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    button { padding: 0.75rem 1.5rem; margin: 0.5rem 0.5rem 0.5rem 0; cursor: pointer; }

  <h1>Web Event Test Page</h1>
  <p class="note">
  Install your client-side GTM container snippet on this page, then use the
  buttons below to push events to <code>dataLayer</code>.
  </p>

  <script>
    window.dataLayer = window.dataLayer || [];

    function pushPurchase() {
      dataLayer.push({
        event: 'purchase',
        ecommerce: {
          transaction_id: 'WEB-TXN-' + Date.now(),
          value: 99.99,
          currency: 'USD',
          items: [{
            item_id: 'SKU-WEB-001',
            item_name: 'Web Test Product',
            price: 99.99,
            quantity: 1
          }]
        },
        user_data: {
          email: 'test.user@example.com',
          phone: '+15551234567'
        }
      });
      console.log('Pushed purchase event', dataLayer[dataLayer.length - 1]);
    }

    function pushLead() {
      dataLayer.push({
        event: 'generate_lead',
        lead_type: 'contact_form',
        value: 0,
        currency: 'USD',
        user_data: {
          email: 'lead@prospect.com',
          phone: '+15559876543'
        }
      });
      console.log('Pushed generate_lead event', dataLayer[dataLayer.length - 1]);
    }
  </script>

  <h2>Trigger Test Events</h2>
  <button onclick="pushPurchase()">Simulate Purchase</button>
  <button onclick="pushLead()">Simulate Lead</button>
</body>
