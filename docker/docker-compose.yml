name: challenge-sgtm

services:
  ssl-init:
    image: alpine:latest
    container_name: challenge-sgtm-ssl-init
    command: sh -c "apk add --no-cache openssl && sh /generate-ssl.sh"
    volumes:
      - ./ssl:/ssl
      - ./generate-ssl.sh:/generate-ssl.sh:ro
    restart: "no"

  gtm-preview:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    container_name: challenge-sgtm-preview
    environment:
      CONTAINER_CONFIG: ${CONTAINER_CONFIG}
      RUN_AS_PREVIEW_SERVER: "true"
    restart: unless-stopped
    networks:
      - gtm-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gtm-live:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    container_name: challenge-sgtm-live
    environment:
      CONTAINER_CONFIG: ${CONTAINER_CONFIG}
      PREVIEW_SERVER_URL: "https://host.docker.internal:8889"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      - gtm-preview
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gtm-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: challenge-sgtm-nginx
    ports:
      - "443:443"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      ssl-init:
        condition: service_completed_successfully
      gtm-live:
        condition: service_started
      gtm-preview:
        condition: service_started
    restart: unless-stopped
    networks:
      - gtm-network

networks:
  gtm-network:
    driver: bridge
